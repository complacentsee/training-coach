# Reachable on the LAN at 0.0.0.0:9999 and via the existing cloudflared
# tunnel. Point a tunnel ingress rule at http://<host>:9999 (or at the
# container over a shared docker network) and put an Access policy on the
# hostname.
services:
  web:
    image: running-coach:latest
    container_name: running-coach
    restart: unless-stopped
    environment:
      TZ: America/Chicago
      # Conditions are frozen onto an activity when it is imported and can
      # never be recovered later from the file alone, so the recording stack
      # is where this has to happen — a session imported here without it is
      # one that has no weather for good. Heat is the loudest uncontrolled
      # variable in a summer session's heart rate, and a grade made anywhere
      # reads better for having it.
      #
      # This is not the grader. Open-Meteo's archive is keyless, so the stack
      # still holds no secret, and what leaves is the position rounded to a
      # tenth of a degree — about eleven km — for the hour a session started.
      WEATHER_LOOKUP: "on"
    # This stack grades, as of 16 Aug 2026. It did not before: grading ran on
    # dev so that live held no key to be spent or leaked, and turning it on
    # here was always meant to be a deliberate edit rather than a file that
    # appeared beside the compose one day. This is that edit.
    #
    # grader.env is NEVER in the repo. It is created on the server, holds the
    # GRADER_* config including the API key, and required:false means a clone
    # without one starts fine with grading simply off — which is what every
    # test and every dataless checkout depends on.
    #
    # What this costs: a real session now posts a real grade to the real log
    # by itself. That is recoverable by construction — a grade is a later
    # entry in an append-only log, and the re-grade control supersedes it —
    # but GRADER_MODE=dry in that file is the setting that watches without
    # writing, and it is one line away.
    env_file:
      - path: grader.env
        required: false
    ports:
      - "0.0.0.0:9999:8080"
    volumes:
      - ./data:/data
