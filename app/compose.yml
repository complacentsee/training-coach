# Reachable on the LAN at 0.0.0.0:9999 and via the existing cloudflared
# tunnel. Point a tunnel ingress rule at http://<host>:9999 (or at the
# container over a shared docker network) and put an Access policy on the
# hostname.
services:
  web:
    image: running-coach:latest
    container_name: running-coach
    restart: unless-stopped
    environment:
      TZ: America/Chicago
    # No env_file, deliberately. This stack does not grade and does not
    # talk to a model provider: it records what the athlete did and serves
    # the plan, and it holds no API key to be spent or leaked. Grading runs
    # on the dev stack, which has its own compose file and its own key.
    # Restoring that here is a deliberate edit, not a dropped-in file.
    ports:
      - "0.0.0.0:9999:8080"
    volumes:
      - ./data:/data
