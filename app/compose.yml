# Reachable on the LAN at 0.0.0.0:9999 and via the existing cloudflared
# tunnel. Point a tunnel ingress rule at http://<host>:9999 (or at the
# container over a shared docker network) and put an Access policy on the
# hostname.
services:
  web:
    image: running-coach:latest
    container_name: running-coach
    restart: unless-stopped
    environment:
      TZ: America/Chicago
    # The grader's configuration, if this stack has any. Optional and inert
    # without the file: no file means GRADER_MODE defaults to off, which is
    # the state until dry-run judgment has earned its way to live. See
    # grader.env.example; a real grader.env never enters git.
    env_file:
      - path: grader.env
        required: false
    ports:
      - "0.0.0.0:9999:8080"
    volumes:
      - ./data:/data
